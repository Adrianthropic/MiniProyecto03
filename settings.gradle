pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// Auto-detect Android SDK location when local.properties is missing (e.g. after clone)
def localProps = file("local.properties")
if (!localProps.exists()) {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (!sdkDir) {
        def candidates = [
            new File(System.getProperty("user.home"), "Android/Sdk"),
            new File(System.getProperty("user.home"), "AppData/Local/Android/Sdk"),
            new File("C:/Users/${System.getProperty('user.name')}/AppData/Local/Android/Sdk")
        ]
        for (c in candidates) { if (c.exists()) { sdkDir = c.absolutePath; break } }
    }
    if (sdkDir) {
        localProps.text = "sdk.dir=" + sdkDir.replace("\\", "\\\\")
    }
}

rootProject.name = "MiniProyecto03"
include(":app")